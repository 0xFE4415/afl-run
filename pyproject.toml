[project]
name = "afl-fuzz-runner"
version = "0.1.0"
license = "BSD-3-Clause"
license-files = ["LICENSE"]
requires-python = ">=3.13"
dependencies = [
    "click>=8.1",
    "inotify-simple>=1.3",
    "pydantic>=2.0",
]

[project.scripts]
afl-run = "afl_run.cli:main"

[project.optional-dependencies]
test = [
    "pytest>=8.0",
    "hypothesis>=6.0",
    "pytest-cov>=5.0",
]
dev = [
    "pytest>=8.0",
    "hypothesis>=6.0",
    "pytest-cov>=5.0",
    "ty>=0.0.1",
    "ruff>=0.6",
    "nox>=2024.0",
]
all = [
    "afl-fuzz-runner[test,dev]",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--cov=afl_run --cov-branch --cov-report=term-missing --cov-fail-under=100"

[tool.coverage.run]
branch = true
source = ["afl_run"]

[tool.coverage.report]
show_missing = true

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "W", "UP"]
ignore = ["D"]

[tool.setuptools.packages.find]
where = ["src"]
